name: Publish app update (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.cjs
      - id: meta
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" == testing || "$GITHUB_REF_NAME" == main ]] || exit 1
          version=$(node -p 'require("./package.json").version')
          channel=$(node -p 'require("./package.json").updateChannel')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          if [[ "$GITHUB_REF_NAME" == testing ]]; then
            [[ "$channel" == testing ]] || exit 1
            tag="testing-v$version"
          else
            [[ "$channel" == main ]] || exit 1
            tag="v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  desktop:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [steamdeck, windows, macos-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y p7zip-full
        if: matrix.target == 'windows'
      - run: python3 tools/package.py --target ${{ matrix.target }}
        env:
          PYTHONUTF8: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
  publish:
    needs: [validate, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          args=()
          if [[ "$GITHUB_REF_NAME" == testing ]]; then args+=(--prerelease); fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Deck Driver Station $TAG" --generate-notes "${args[@]}"
