name: Publish app update (manual)
on:
  workflow_dispatch:
  # Pushing v<version> (from main) or testing-v<version> (from testing) publishes that commit.
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*', 'testing-v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
# One publish per tag or branch; a duplicate trigger cancels the earlier run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      branch: ${{ steps.meta.outputs.branch }}
      targets: ${{ steps.meta.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The tests load the git-ignored simulator bundles (ui/vendor, sim-runtime), so build them first.
      - name: Build the offline simulator (public assets only)
        run: |
          node tools/simulation/fetch.cjs --targets linux-x64
          node tools/simulation/build.cjs --public
      - run: node --test tests/*.test.cjs
      - run: bash tests/install-bootstrap.sh
      - run: pwsh -NoProfile -File tests/install-bootstrap.ps1
      - id: meta
        shell: bash
        run: |
          branch=$GITHUB_REF_NAME
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" == testing-v* ]]; then branch=testing; else branch=main; fi
            git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch" || { echo "$GITHUB_REF_NAME is not on $branch"; exit 1; }
          fi
          [[ "$branch" == testing || "$branch" == main ]] || exit 1
          version=$(node -p 'require("./package.json").version')
          channel=$(node -p 'require("./package.json").updateChannel')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          if [[ "$branch" == testing ]]; then
            [[ "$channel" == testing ]] || exit 1
            tag="testing-v$version"
          else
            [[ "$channel" == main ]] || exit 1
            tag="v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" == "$tag" ]] || { echo "tag $GITHUB_REF_NAME does not match package.json ($tag)"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          # Main builds every platform; testing builds package.json's testingReleaseTargets.
          targets=$(node tools/release-targets.cjs targets "$branch")
          echo "Building: $targets"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
  desktop:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ${{ fromJSON(needs.validate.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y p7zip-full
        if: matrix.target == 'windows'
      - name: Build the offline simulator (public assets only)
        shell: bash
        run: |
          case "${{ matrix.target }}" in steamdeck) t=linux-x64;; windows) t=win32-x64;; macos-arm64) t=darwin-arm64;; esac
          node tools/simulation/fetch.cjs --targets "$t"
          node tools/simulation/build.cjs --public
      - run: python3 tools/package.py --target ${{ matrix.target }}
        env:
          PYTHONUTF8: '1'
      - run: bash tests/installer-linux.sh
        if: matrix.target == 'steamdeck'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
  publish:
    needs: [validate, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      # Every built platform must have its update download and checksum, and nothing else may be
      # there. A release for only some platforms leaves out the App package, which fits every
      # platform: older updaters would install it on the devices this release was not built for.
      - name: Publish the built platforms
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          BRANCH: ${{ needs.validate.outputs.branch }}
          TARGETS: ${{ needs.validate.outputs.targets }}
        run: |
          node tools/release-targets.cjs prepare dist "$TARGETS" "$VERSION" "$TAG" > "$RUNNER_TEMP/release.json"
          args=(--title "$(jq -r .title "$RUNNER_TEMP/release.json")")
          notes=$(jq -r .notes "$RUNNER_TEMP/release.json")
          # gh puts --notes before the generated notes; the in-app changelog shows both.
          if [[ -n "$notes" ]]; then args+=(--notes "$notes"); fi
          if [[ "$BRANCH" == testing ]]; then args+=(--prerelease); fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --generate-notes "${args[@]}"
      # The in-app updater reads this fixed download first, so update checks do not spend
      # GitHub's 60-per-hour API allowance. Sizes and digests come from the release itself.
      # The new release comes first; up to five earlier ones of the channel follow, so a device a
      # partial release skips can still find the newest release with its download.
      - name: Update the channel manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          BRANCH: ${{ needs.validate.outputs.branch }}
        run: |
          if [[ "$BRANCH" == testing ]]; then channel=testing; pattern='^testing-v[0-9]+[.][0-9]+[.][0-9]+$'; else channel=main; pattern='^v[0-9]+[.][0-9]+[.][0-9]+$'; fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/newest.json"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" > "$RUNNER_TEMP/recent.json" || echo '[]' > "$RUNNER_TEMP/recent.json"
          jq -s --arg channel "$channel" --arg tag "$TAG" --arg pattern "$pattern" '
            def slim: {tag_name,prerelease,draft,body:((.body//"")[:8000]),assets:[.assets[]|{name,size,digest,state,browser_download_url}]};
            {schema:1,channel:$channel,releases:([.[0]|slim]+[(.[1]|if type=="array" then .[] else empty end)|select(.tag_name!=$tag and (.draft|not) and (.tag_name|test($pattern)))|slim][:5])}' "$RUNNER_TEMP/newest.json" "$RUNNER_TEMP/recent.json" > channel.json
          jq -e --arg tag "$TAG" '.releases[0].tag_name==$tag and (.releases[0].assets|length)>0 and all(.releases[0].assets[];.digest!=null and .size>0)' channel.json
          if ! gh release view "$channel-channel" >/dev/null 2>&1; then
            gh release create "$channel-channel" --prerelease --latest=false --target "$GITHUB_SHA" --title "Deck Driver Station $channel channel (updater manifest)" --notes "Used by the in-app updater. Install from the versioned releases."
          fi
          gh release upload "$channel-channel" channel.json --clobber
