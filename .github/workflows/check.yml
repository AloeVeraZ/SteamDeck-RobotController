name: Check and package desktop apps
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/*.test.cjs
      - run: bash -n packaging/install.sh packaging/launch.sh packaging/Install-Mac.command
      - run: mkdir -p test-results && bash tests/update-linux.sh
      - run: bash tests/install-bootstrap.sh
      - run: pwsh -NoProfile -File tests/install-bootstrap.ps1
  desktop:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [steamdeck, windows, macos-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y p7zip-full
        if: matrix.target == 'windows'
      - run: python3 tools/package.py --target ${{ matrix.target }}
        env:
          PYTHONUTF8: '1'
      - run: bash tests/installer-linux.sh
        if: matrix.target == 'steamdeck'
      - uses: actions/setup-node@v4
        if: matrix.target == 'steamdeck'
        with:
          node-version: '24'
      - name: Check handheld controller assignment in Linux Electron
        if: matrix.target == 'steamdeck'
        env:
          DECK_ELECTRON_TEST_NO_SANDBOX: '1'
          DECK_TEST_CONTROLLERS_ONLY: '1'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb openbox libgtk-3-0t64 libnss3 libasound2t64 libgbm1
          export DECK_ELECTRON="$PWD/.cache/runtime-linux-x64-$(node -p 'require("./package.json").devDependencies.electron')/electron"
          for model in 'Steam Deck LCD' 'Steam Deck OLED' 'ROG Ally X' 'Lenovo Legion Go'; do
            DECK_TEST_MODEL="$model" xvfb-run -a node tests/ftc-app.cjs
          done
          for model in 'Steam Deck LCD' 'Windows handheld' 'Apple Silicon'; do
            DECK_TEST_MODEL="$model" xvfb-run -a node tests/controller-app.cjs
          done
      - name: Check redesigned controller and FTC layouts in Linux Electron
        if: matrix.target == 'steamdeck'
        env:
          DECK_ELECTRON_TEST_NO_SANDBOX: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm install --prefix .cache/ui-check --no-save playwright@1.62.1
          export DECK_PLAYWRIGHT="$PWD/.cache/ui-check/node_modules/playwright"
          export DECK_ELECTRON="$PWD/.cache/runtime-linux-x64-$(node -p 'require("./package.json").devDependencies.electron')/electron"
          DECK_UI_LAYOUT_ONLY=1 xvfb-run -a node tests/ui.cjs
          xvfb-run -a node tests/controller-ui.cjs
          xvfb-run -a node tests/controller-session.cjs
          xvfb-run -a node tests/recovery-app.cjs
          xvfb-run -a node tests/discovery-ui.cjs
          xvfb-run -a node tests/design-ui.cjs
          DECK_TEST_WINDOW_MANAGER=openbox xvfb-run -a node tests/robot-fullscreen.cjs
          DECK_TEST_WINDOW_MANAGER=openbox xvfb-run -a node tests/touch-ui.cjs
          xvfb-run -a node tests/controller-compatibility.cjs
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'steamdeck' && always()
        with:
          name: driver-station-ui-checks
          path: |
            test-results/controllers/*.png
            test-results/design/*.png
            test-results/v2/*.png
            test-results/touch/*.png
            test-results/discovery/*.png
            test-results/recovery/*.png
      - uses: actions/checkout@v4
        if: matrix.target == 'steamdeck'
        with:
          repository: AloeVeraZ/MotionModule
          ref: bbd8c33dadcd68256bb98e20437b02a0e99b3a0b
          path: .cache/motionmodule-source
          persist-credentials: false
      - name: Check actual MotionModule driver station with simulated GPIO
        if: matrix.target == 'steamdeck'
        env:
          DECK_ELECTRON_TEST_NO_SANDBOX: '1'
          DECK_PYTHON: python3
        run: |
          python3 -m pip install --target .cache/motionmodule-test-deps 'Flask>=3.1,<4' 'smbus2>=0.5,<1' 'pyserial>=3.5,<4'
          export DECK_ELECTRON="$PWD/.cache/runtime-linux-x64-$(node -p 'require("./package.json").devDependencies.electron')/electron"
          export DECK_MOTIONMODULE_SOURCE="$PWD/.cache/motionmodule-source"
          xvfb-run -a node tests/motionmodule-app.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-installer
          path: dist/*
